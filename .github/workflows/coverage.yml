name: Coverage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coverage-python-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ais_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ais_project"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NAVICAST_TEST_DSN: host=127.0.0.1 port=5432 dbname=ais_project user=postgres password=local-test-only
      COVERAGE_FILE: reports/.coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt -r research/requirements.txt
      - run: mkdir -p reports
      - run: python -m coverage run --branch --source=api_server,config,mqtt_client,prediction_service,evaluate -m pytest tests research -q -ra --junitxml=reports/python.xml
      - run: python -m coverage json -o reports/python-coverage.json && python -m coverage xml -o reports/python-coverage.xml && python -m coverage report
        if: always()
      - run: python scripts/check_test_report.py reports/python.xml tests/inventory/python.json && python scripts/check_coverage.py python reports/python-coverage.json
        if: always()
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: python scripts/check_test_report.py reports/node.xml tests/inventory/node.json && python scripts/check_coverage.py node reports/node.lcov
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-node-coverage
          path: reports/
          if-no-files-found: error
