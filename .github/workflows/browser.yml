name: Browser E2E
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run report:browser-coverage
        if: always()
      - run: python scripts/check_test_report.py reports/browser.xml
        if: always()
      - run: python scripts/check_coverage.py browser reports/browser-coverage.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports-and-failure-artifacts
          path: reports/
          if-no-files-found: error
