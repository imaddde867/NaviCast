# Reviewer boot path (no MQTT needed): cp .env.example .env && docker compose up
# Then /vessels returns 200 with seeded rows.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NAVICAST_DB_NAME:-ais_project}
      POSTGRES_USER: ${NAVICAST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NAVICAST_DB_PASSWORD:?set NAVICAST_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NAVICAST_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    environment:
      NAVICAST_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    command: sh -c "pip install -r requirements.txt && uvicorn api_server:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
